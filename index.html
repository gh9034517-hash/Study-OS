<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="StudyOS — plataforma inteligente de estudos com tutor de IA, quiz, plano, revisão espaçada e diagnóstico de aprendizagem." />
    <meta name="theme-color" content="#040920" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet" />
    <title>StudyOS</title>
    <script>
      // Evita o "piscar" do tema escuro para quem escolheu o tema claro.
      try {
        var a = (JSON.parse(localStorage.getItem('studyos:data:v1') || '{}').appearance || {}).theme;
        if (a === 'claro' || (a === 'sistema' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.theme = 'claro';
          document.documentElement.style.background = '#e9eefa';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>O StudyOS precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
